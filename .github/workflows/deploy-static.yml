name: 🌐 Deploy static build

# Builds the singleplayer static site and publishes it to the Cloudflare
# Pages project cheonha-tongil on every push to samguk-skeleton, so the
# Somusoft web game page always runs the latest version.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that owns cheonha-tongil
# Without them the job builds and skips the upload.

on:
  push:
    branches: [samguk-skeleton]
  workflow_dispatch:

concurrency:
  group: deploy-static
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build-static
      - name: Upload to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run deploy-static
      - name: Note missing secrets
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; built but not deployed."
